<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — TradesAd Suite™</title>
<meta name="description" content="Contact the TradesAd Suite team. Support: support@tradesad.com.">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="page">
<header class="site-header" id="siteNav"></header>

<section class="section">
  <div class="container">
    <div class="form-card">
      <h1>Contact us</h1>
      <p class="lede">Questions about plans, the rule engine, or a report? Email us directly at <a href="mailto:support@tradesad.com">support@tradesad.com</a> — or use the form below.</p>
      <div id="formNotice"></div>
      <form id="contactForm" novalidate>
        <div class="field">
          <label for="c-name">Name</label>
          <input type="text" id="c-name" autocomplete="name" placeholder="Jane Smith">
          <div class="ferr" id="ferr-c-name"></div>
        </div>
        <div class="field">
          <label for="c-email">Email</label>
          <input type="email" id="c-email" autocomplete="email" placeholder="you@company.com">
          <div class="ferr" id="ferr-c-email"></div>
        </div>
        <div class="field">
          <label for="c-subject">Subject</label>
          <input type="text" id="c-subject" placeholder="Question about Pro Agency">
        </div>
        <div class="field">
          <label for="c-message">Message</label>
          <textarea id="c-message" rows="6" placeholder="How can we help?"></textarea>
          <div class="ferr" id="ferr-c-message"></div>
        </div>
        <button class="btn-volt" type="submit" style="width:100%">Send message</button>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer" id="siteFoot"></footer>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
